[custom]
enable_rule_generator=true
overwrite_original_rules=true

[Proxy Group]
[01] Proxy = select, [02] AutoTest, [03] Failover, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[02] AutoTest = url-test, https://www.google.com/generate_204, 120, 50
[03] Failover = fallback, https://www.google.com/generate_204, 120
[04] HK = url-test, https://www.google.com/generate_204, 300, 100, (?i)香港|\bHK\b|Hong Kong
[05] SG = url-test, https://www.google.com/generate_204, 300, 100, (?i)新加坡|\bSG\b|Singapore
[06] JP = url-test, https://www.google.com/generate_204, 300, 100, (?i)日本|\bJP\b|Japan
[07] US = url-test, https://www.google.com/generate_204, 300, 100, (?i)美国|\bUS\b|United States|America|\bUSA\b
[08] TW = url-test, https://www.google.com/generate_204, 300, 100, (?i)台湾|\bTW\b|Taiwan
[09] Other = url-test, https://www.google.com/generate_204, 300, 100, ^(?!.*(香港|HK|新加坡|SG|日本|JP|美国|US|USA|台湾|TW|官网|套餐)).*$
[10] Telegram = select, [01] Proxy, [02] AutoTest, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[11] PikPak = select, [01] Proxy, [02] AutoTest, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[12] Twitter = select, [01] Proxy, [02] AutoTest, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[13] YouTube = select, [01] Proxy, [02] AutoTest, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[14] AI = select, [01] Proxy, [02] AutoTest, [04] HK, [05] SG, [06] JP, [07] US, [08] TW, [09] Other, DIRECT
[15] Direct = select, DIRECT, [01] Proxy
[16] Reject = select, REJECT, DIRECT
[17] CatchAll = select, [01] Proxy, [02] AutoTest, DIRECT
[18] GLOBAL = select, DIRECT, [01] Proxy, [02] AutoTest

