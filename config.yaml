# ==========================================
# Clash.Meta Regional Config - v1.2.4
# Fix: Google送中 / TUN+系统代理泄露 / YouTube独立
# ==========================================
mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  strict-route: true
  dns-hijack: ["any:53","tcp://any:53"]
  auto-route: true
  auto-detect-interface: true
  mtu: 1500

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8088]}
  force-domain: ['+.google.com','+.googleapis.com','+.gstatic.com','+.googleusercontent.com','+.youtube.com']
  skip-domain: ['+.cn','+.local','+.lan']

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['+.lan','+.local','time.*.com','pool.ntp.org','+.msftconnecttest.com','+.msftncsi.com']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
  proxy-server-nameserver: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
  direct-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]

proxies: []

proxy-groups:
  # Google 专属组先定义，避免前向引用
    - {name: " Google-Auto", type: url-test, url: https://www.google.com/generate_204, interval: 180, tolerance: 50, include-all: true, filter: '^(?i)(?!.*(回国|家宽|落地|内网|IEPL|官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[19] Google", type: select, proxies: [" Google-Auto", "[04] HK", "[05] SG", "[06] JP", "[07] US", "[08] TW"]}
    - {name: "[01] Proxy", type: select, include-all: true, proxies: ["[02] AutoTest", "[03] Failover", "[04] HK", "[05] SG", "[06] JP", "[07] US", "[08] TW", "[09] Other", "[19] Google", "DIRECT"]}
    - {name: "[02] AutoTest", type: url-test, url: https://www.google.com/generate_204, interval: 120, tolerance: 50, include-all: true, filter: '^(?i)(?!.*(回国|家宽|落地|内网|IEPL|官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[03] Failover", type: fallback, url: https://www.google.com/generate_204, interval: 120, include-all: true, filter: '^(?i)(?!.*(回国|家宽|落地|内网|IEPL|官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[04] HK", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)香港|\bHK\b|Hong Kong'}
    - {name: "[05] SG", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)新加坡|\bSG\b|Singapore'}
    - {name: "[06] JP", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)日本|\bJP\b|Japan'}
    - {name: "[07] US", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)美国|\bUS\b|United States|America|\bUSA\b'}
    - {name: "[08] TW", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)台湾|\bTW\b|Taiwan'}
    - {name: "[09] Other", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(香港|\bHK\b|Hong Kong|新加坡|\bSG\b|Singapore|日本|\bJP\b|Japan|美国|\bUS\b|America|\bUSA\b|台湾|\bTW\b|Taiwan|官网|套餐|流量|剩余)).*$'}
    - {name: "[10] Telegram", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[11] PikPak", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[12] Twitter", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[13] YouTube", type: url-test, url: https://www.google.com/generate_204, interval: 120, tolerance: 50, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[14] AI", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|剩余|过期|失效|重置|测试)).*$'}
    - {name: "[15] Direct", type: select, proxies: ["DIRECT", "[01] Proxy"]}
    - {name: "[16] Reject", type: select, proxies: ["REJECT", "DIRECT"]}
    - {name: "[17] CatchAll", type: select, proxies: ["[01] Proxy", "[02] AutoTest", "DIRECT"]}
    - {name: "[18] GLOBAL", type: select, proxies: ["DIRECT", "[01] Proxy", "[02] AutoTest"]}

rule-providers:
  reject: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt}
  proxy: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt}
  direct: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt}
  gfw: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt}
  cncidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt}
  lancidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt}
  telegram: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Telegram/Telegram.yaml}
  telegramcidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt}
  twitter: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Twitter/Twitter.yaml}
  youtube: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/YouTube/YouTube.yaml}
  pikpak: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/PikPak/PikPak.yaml}
  ai: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/dler-io/Rules@main/Clash/Provider/AI.yaml}
  google: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Google/Google.yaml}

rules:
    - DOMAIN-KEYWORD,stun,REJECT
    - DOMAIN-KEYWORD,turn,REJECT
    - DST-PORT,19302,REJECT
    - RULE-SET,reject,[16] Reject
    - DOMAIN-SUFFIX,youtube.com,[13] YouTube
    - DOMAIN-SUFFIX,youtu.be,[13] YouTube
    - DOMAIN-SUFFIX,ytimg.com,[13] YouTube
    - DOMAIN-SUFFIX,youtube-nocookie.com,[13] YouTube
    - DOMAIN-SUFFIX,googlevideo.com,[13] YouTube
    - DOMAIN-SUFFIX,yt3.ggpht.com,[13] YouTube
    - RULE-SET,youtube,[13] YouTube
    - DOMAIN-SUFFIX,google.com,[19] Google
    - DOMAIN-SUFFIX,googleapis.com,[19] Google
    - DOMAIN-SUFFIX,gstatic.com,[19] Google
    - DOMAIN-SUFFIX,googleusercontent.com,[19] Google
    - DOMAIN-SUFFIX,gmail.com,[19] Google
    - DOMAIN-SUFFIX,android.com,[19] Google
    - RULE-SET,google,[19] Google
    - RULE-SET,telegram,[10] Telegram
    - RULE-SET,telegramcidr,[10] Telegram,no-resolve
    - RULE-SET,pikpak,[11] PikPak
    - RULE-SET,twitter,[12] Twitter
    - DOMAIN-SUFFIX,meta.ai,[14] AI
    - DOMAIN-SUFFIX,openai.com,[14] AI
    - DOMAIN-SUFFIX,chatgpt.com,[14] AI
    - DOMAIN-SUFFIX,claude.ai,[14] AI
    - RULE-SET,ai,[14] AI
