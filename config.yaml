# ==========================================
# FINAL COMPLETE - v1.2.4 - 20260923
# 调整：业务组在前，地区组[10]-[15]挪到[09]AI后面 / 删除Google-Auto / Google默认[01]
# ==========================================
mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  strict-route: true
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-detect-interface: true
  mtu: 1500

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8088]}

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['+.lan','+.local','+.apple.com','+.icloud.com','+.mzstatic.com','+.msftconnecttest.com','+.msftncsi.com','localhost.ptlogin2.qq.com','+.in-addr.arpa','+.ip6.arpa','time.*.com','pool.ntp.org']
  default-nameserver: [223.5.5.5, 1.2.4.8]
  nameserver: [https://1.1.1.1/dns-query, https://8.8.4.4/dns-query]
  proxy-server-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  direct-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]

proxies:

proxy-groups:
    - {name: "[01] Proxy", type: select, include-all: true, proxies: ["[02] AutoTest", "[03] Failover", "[10] HK", "[11] SG", "[12] JP", "[13] US", "[14] TW", "[15] Other", "DIRECT"], filter: '^(?i)(?!.*(官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'}
    - {name: "[02] AutoTest", type: url-test, url: https://www.google.com/generate_204, interval: 120, tolerance: 50, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'}
    - {name: "[03] Failover", type: fallback, url: https://www.google.com/generate_204, interval: 120, include-all: true, filter: '^(?i)(?!.*(官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'}
  # 业务组，全部在前
    - {name: "[04] Google", type: select, proxies: ["[01] Proxy", "[02] AutoTest", "[10] HK", "[11] SG", "DIRECT"], include-all: true}
    - {name: "[05] Telegram", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, proxies: []}
    - {name: "[06] PikPak", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, proxies: []}
    - {name: "[07] Twitter", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, proxies: []}
    - {name: "[08] YouTube", type: url-test, url: https://www.google.com/generate_204, interval: 120, tolerance: 50, include-all: true, proxies: []}
    - {name: "[09] AI", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, proxies: []}
  # 地区组，全部挪到AI后面开始排
    - {name: "[10] HK", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)香港|\bHK\b|Hong Kong'}
    - {name: "[11] SG", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)新加坡|\bSG\b|Singapore'}
    - {name: "[12] JP", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)日本|\bJP\b|Japan'}
    - {name: "[13] US", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)美国|\bUS\b|United States|America|\bUSA\b'}
    - {name: "[14] TW", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '(?i)台湾|\bTW\b|Taiwan'}
    - {name: "[15] Other", type: url-test, url: https://www.google.com/generate_204, interval: 300, tolerance: 100, include-all: true, filter: '^(?i)(?!.*(香港|\bHK\b|Hong Kong|新加坡|\bSG\b|Singapore|日本|\bJP\b|Japan|美国|\bUS\b|America|\bUSA\b|台湾|\bTW\b|Taiwan|官网|套餐)).*$'}
    - {name: "[16] Direct", type: select, proxies: ["DIRECT", "[01] Proxy"]}
    - {name: "[17] Reject", type: select, proxies: ["REJECT", "DIRECT"]}
    - {name: "[18] CatchAll", type: select, proxies: ["[01] Proxy", "[02] AutoTest", "DIRECT"]}
    - {name: "[19] GLOBAL", type: select, proxies: ["DIRECT", "[01] Proxy", "[02] AutoTest"]}

rule-providers:
  reject: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt}
  proxy: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt}
  direct: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt}
  gfw: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt}
  cncidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt}
  lancidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt}
  telegram: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Telegram/Telegram.yaml}
  telegramcidr: {type: http, format: yaml, interval: 86400, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt}
  twitter: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Twitter/Twitter.yaml}
  youtube: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/YouTube/YouTube.yaml}
  pikpak: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/PikPak/PikPak.yaml}
  ai: {type: http, format: yaml, interval: 86400, behavior: domain, url: https://fastly.jsdelivr.net/gh/dler-io/Rules@main/Clash/Provider/AI.yaml}

rules:
    - DOMAIN-KEYWORD,stun,REJECT
    - DOMAIN-KEYWORD,turn,REJECT
    - DST-PORT,19302,REJECT
    - DOMAIN-SUFFIX,youtube.com,[08] YouTube
    - DOMAIN-SUFFIX,youtu.be,[08] YouTube
    - DOMAIN-SUFFIX,ytimg.com,[08] YouTube
    - DOMAIN-SUFFIX,youtube-nocookie.com,[08] YouTube
    - DOMAIN-SUFFIX,googlevideo.com,[08] YouTube
    - RULE-SET,reject,[17] Reject
    - RULE-SET,telegram,[05] Telegram
    - RULE-SET,telegramcidr,[05] Telegram,no-resolve
    - RULE-SET,pikpak,[06] PikPak
    - RULE-SET,twitter,[07] Twitter
    - RULE-SET,youtube,[08] YouTube
    - DOMAIN-SUFFIX,google.com,[04] Google
    - DOMAIN-SUFFIX,gstatic.com,[04] Google
    - DOMAIN-SUFFIX,googleapis.com,[04] Google
    - DOMAIN-SUFFIX,googleusercontent.com,[04] Google
    - DOMAIN-SUFFIX,meta.ai,[09] AI
    - DOMAIN-SUFFIX,openai.com,[09] AI
    - DOMAIN-SUFFIX,chatgpt.com,[09] AI
    - DOMAIN-SUFFIX,claude.ai,[09] AI
    - DOMAIN-SUFFIX,gemini.google.com,[09] AI
    - RULE-SET,ai,[09] AI
    - RULE-SET,proxy,[01] Proxy
    - RULE-SET,gfw,[01] Proxy
    - RULE-SET,direct,[16] Direct
    - RULE-SET,lancidr,[16] Direct,no-resolve
    - RULE-SET,cncidr,[16] Direct,no-resolve
    - GEOIP,CN,[16] Direct,no-resolve
    - MATCH,[18] CatchAll
