# ==========================================
# Clash.Meta Regional Config - YAML Version
# Version: 1.2.0-beta (YAML)
# Groups: [01]-[18] Numbered English, Force Order
# Includes: Telegram, PikPak, Twitter, YouTube, AI (含 Meta AI)
# ==========================================

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  strict-route: true
  dns-hijack: []
  auto-route: true
  auto-detect-interface: true
  mtu: 1500

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8088]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
        - '+.lan'
        - '+.local'
        - '+.apple.com'
        - '+.icloud.com'
        - '+.mzstatic.com'
        - '+.msftconnecttest.com'
        - '+.msftncsi.com'
        - 'localhost.ptlogin2.qq.com'
        - 'localhost.sec.qq.com'
        - '+.in-addr.arpa'
        - '+.ip6.arpa'
        - 'time.*.com'
        - 'time.*.gov'
        - 'pool.ntp.org'
  default-nameserver:
        - 223.5.5.5
        - 1.2.4.8
  nameserver:
        - https://1.1.1.1/dns-query
        - https://8.8.4.4/dns-query
  proxy-server-nameserver:
        - https://223.5.5.5/dns-query
        - https://doh.pub/dns-query
  direct-nameserver:
        - https://223.5.5.5/dns-query
        - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn,private":
            - https://223.5.5.5/dns-query
            - https://doh.pub/dns-query

# Sub-Store 会自动填充这里，留空就行
proxies:

proxy-groups:
    - name: "[01] Proxy"
    type: select
    include-all: true
    proxies: ["[02] AutoTest", "[03] Failover", "[04] HK", "[05] SG", "[06] JP", "[07] US", "[08] TW", "[09] Other", "DIRECT"]

    - name: "[02] AutoTest"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 120
    timeout: 3000
    tolerance: 50
    include-all: true
    filter: '^(?i)(?!.*(官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'

    - name: "[03] Failover"
    type: fallback
    url: https://www.google.com/generate_204
    interval: 120
    timeout: 3000
    include-all: true
    filter: '^(?i)(?!.*(官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'

  # [04]-[09] Regional - v1.1.17 修复版，带 \b 边界
    - name: "[04] HK"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '(?i)香港|\bHK\b|Hong Kong'

    - name: "[05] SG"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '(?i)新加坡|\bSG\b|Singapore'

    - name: "[06] JP"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '(?i)日本|\bJP\b|Japan'

    - name: "[07] US"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '(?i)美国|\bUS\b|United States|America|\bUSA\b'

    - name: "[08] TW"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '(?i)台湾|\bTW\b|Taiwan'

    - name: "[09] Other"
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 100
    include-all: true
    filter: '^(?i)(?!.*(香港|\bHK\b|Hong Kong|新加坡|\bSG\b|Singapore|日本|\bJP\b|Japan|美国|\bUS\b|United States|America|\bUSA\b|台湾|\bTW\b|Taiwan|官网|套餐|流量|异常|剩余|过期|失效|维护|高倍|倍率|测试|Test|备用|到期|重置)).*$'

  # [10]-[14] Service Groups - v1.2.0 new
    - name: "[10] Telegram"
    type: select
    proxies: ["[01] Proxy", "[02] AutoTest", "[04] HK", "[05] SG", "[06] JP", "[07] US", "[08] TW", "[09] Other", "DIRECT"]

    - name: "[11] PikPak
